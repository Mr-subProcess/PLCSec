[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plcsec"
version = "0.6.0"
description = "Safety-first OT asset inventory, passive protocol intelligence, SIEM exports and tamper-evident evidence management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PLCSEC Contributors" }]
keywords = ["PLC", "OT", "ICS", "SCADA", "Modbus", "S7comm", "EtherNet-IP", "CIP", "OPC-UA", "DNP3", "IEC-104", "BACnet", "firmware-analysis", "Ed25519", "industrial-cybersecurity", "passive-analysis", "asset-inventory", "STIX 2.1", "CEF", "audit-evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
pcap = ["scapy>=2.6,<3"]
s7 = ["python-snap7>=3.1,<4"]
crypto = ["cryptography>=43,<48"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2", "build>=1.2,<2"]
all = ["scapy>=2.6,<3", "python-snap7>=3.1,<4", "cryptography>=43,<48"]

[project.scripts]
plcsec = "plcsec.cli:main"
plcsec_util = "plcsec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.setuptools.package-data]
plcsec = ["py.typed", "schemas/*.json", "data/*.json"]
